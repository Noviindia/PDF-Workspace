name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-ndk-r25b-v1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            gettext \
            ccache \
            patch

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install "cython<3.0.0" buildozer==1.5.0

      - name: Clone & Patch python-for-android (release-2024.01.21) for Android 16 (16KB Page Size & Pure ARM64)
        run: |
          git clone --branch release-2024.01.21 --depth 1 https://github.com/kivy/python-for-android.git /tmp/p4a
          python3 - << 'EOF'
          import glob

          # 1. Force 16KB ELF page alignment in common_ldflags & common_ldshared for Android 15/16 (OnePlus 13R)
          archs_path = "/tmp/p4a/pythonforandroid/archs.py"
          with open(archs_path, "r") as f:
              content = f.read()
          assert "common_ldflags = ['-L{ctx_libs_dir}']" in content, "common_ldflags not found"
          content = content.replace(
              "common_ldflags = ['-L{ctx_libs_dir}']",
              "common_ldflags = ['-L{ctx_libs_dir}', '-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']"
          )
          assert "'-Wl,-Bsymbolic-functions'," in content, "common_ldshared not found"
          content = content.replace(
              "'-Wl,-Bsymbolic-functions',",
              "'-Wl,-Bsymbolic-functions',\n        '-Wl,-z,max-page-size=16384',\n        '-Wl,-z,common-page-size=16384',"
          )
          with open(archs_path, "w") as f:
              f.write(content)

          # 2. Force 16KB ELF page alignment in all Application.mk files (for ndk-build: libSDL2.so, libmain.so, etc.)
          for app_mk in glob.glob("/tmp/p4a/pythonforandroid/**/Application.mk", recursive=True):
              with open(app_mk, "r") as f:
                  mk = f.read()
              if "max-page-size=16384" not in mk:
                  mk += "\nAPP_LDFLAGS += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384\n"
                  with open(app_mk, "w") as f:
                      f.write(mk)

          # 3. Pin chardet==5.2.0 (pure Python) in KivyRecipe so pip never pulls x86_64 mypyc .so wheels
          kivy_recipe = "/tmp/p4a/pythonforandroid/recipes/kivy/__init__.py"
          with open(kivy_recipe, "r") as f:
              kc = f.read()
          kc = kc.replace("'chardet'", "'chardet==5.2.0'")
          with open(kivy_recipe, "w") as f:
              f.write(kc)

          # 4. Ensure directories in private.tar have 0755 permissions on Android 16 while preserving .so modes
          build_py = "/tmp/p4a/pythonforandroid/bootstraps/common/build/build.py"
          with open(build_py, "r") as f:
              bc = f.read()
          bc = bc.replace(
              "tinfo.mtime = 0\n        return tinfo",
              "tinfo.mtime = 0\n        if tinfo.isdir():\n            tinfo.mode = 0o755\n        return tinfo"
          )
          with open(build_py, "w") as f:
              f.write(bc)

          print("Successfully patched python-for-android release-2024.01.21 for Android 16 (16KB page size & pure ARM64)!")
          EOF

      - name: Build Android APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
          LDFLAGS: "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        run: |
          yes | buildozer android debug

      - name: Verify APK 16KB ELF Alignment & Pure ARM64 Bundle
        run: |
          mkdir -p /tmp/verify_apk
          unzip -q bin/*.apk -d /tmp/verify_apk
          for so in /tmp/verify_apk/lib/arm64-v8a/*.so; do
            echo "=== $(basename $so) ==="
            readelf -l "$so" | grep -A 1 "LOAD" | head -n 4
          done

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Workspace-Android16-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PDF Workspace & Converter v1.0.1 (Android 16 / OnePlus 13R)"
          body: "Automated Android 16 (16KB ELF page-aligned, pure ARM64) APK build of PDF Workspace & Converter."
          files: bin/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
